name: Deploy worker

on:
  push:
    branches: [main]
    paths: [worker.js, wrangler.toml, package.json, package-lock.json]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b88a9b1ba068ad113b6ed1b8266d3587
          wranglerVersion: "4.136.3"
